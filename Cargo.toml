[package]
name = "java_parse"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust2java"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"
which = "7"
ra_ap_hir = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_syntax = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_paths = "=0.0.358"
ra_ap_vfs = "=0.0.358"

[dev-dependencies]
duct = "1"

[profile.dev.package."*"]
opt-level = 2
